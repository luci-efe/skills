name: skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install relay memory dependency
        shell: bash
        run: |
          python -m pip install uv
          uv tool install --python 3.12 mnemosyne-memory
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Test with no skipped coverage
        shell: bash
        run: |
          node --test --test-reporter=tap "test/**/*.test.mjs" | tee "$RUNNER_TEMP/tests.tap"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {join} from "node:path"; import assert from "node:assert/strict"; assert.match(readFileSync(join(process.env.RUNNER_TEMP,"tests.tap"),"utf8"),/^# skipped 0$/m,"CI must execute every test, including relay memory tests");'
      - run: npm run check:vendor
      - run: npm run lint:skills
